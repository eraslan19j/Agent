<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F5F5F7" />
    <meta name="description" content="My Vision — fotoğraflarını cihazında görünümler, hassas renk ayarları, metin ve kolaj araçlarıyla düzenle." />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>My Vision — Fotoğraf stüdyosu</title>
    <script>
      try {
        var p = JSON.parse(localStorage.getItem('myvision.preferences.v2') || '{}');
        var systemDark = matchMedia('(prefers-color-scheme: dark)').matches;
        var t = !p.theme || p.theme === 'system' ? (systemDark ? 'dark' : 'light') : (p.theme === 'light' ? 'light' : 'dark');
        document.documentElement.dataset.theme = t;
        document.documentElement.lang = p.language || 'tr';
        document.documentElement.style.colorScheme = t;
      } catch (_) { document.documentElement.dataset.theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
