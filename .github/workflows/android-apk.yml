name: Build My Vision Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - arena/2abc0dfe-agent
    paths:
      - 'src/**'
      - 'public/**'
      - 'android/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.ts'
      - 'vite.config.ts'
      - 'tsconfig*.json'
      - 'index.html'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  assemble-debug:
    name: Assemble installable debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out My Vision
        uses: actions/checkout@v4
        with:
          ref: arena/2abc0dfe-agent

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_HOME/platforms"
          ls "$ANDROID_HOME/build-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install web dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify web application
        run: |
          npm run test
          npm run lint

      - name: Build and synchronize Android assets
        run: npm run cap:sync

      - name: Assemble APK
        working-directory: android
        shell: bash
        run: |
          set +e
          ./gradlew assembleDebug --no-daemon > ../android-build.log 2>&1
          STATUS=$?
          cat ../android-build.log
          if [ "$STATUS" -ne 0 ]; then
            ESCAPED_LOG=$(tail -n 45 ../android-build.log | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error::${ESCAPED_LOG}"
          fi
          exit "$STATUS"

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk My-Vision-1.0.0-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: My-Vision-1.0.0-debug
          path: My-Vision-1.0.0-debug.apk
          if-no-files-found: error
          retention-days: 30
