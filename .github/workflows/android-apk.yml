name: Build My Vision Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - arena/2abc0dfe-agent
    paths:
      - 'src/**'
      - 'public/**'
      - 'android/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.ts'
      - 'vite.config.ts'
      - 'tsconfig*.json'
      - 'index.html'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

jobs:
  assemble-debug:
    name: Assemble installable debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out My Vision
        uses: actions/checkout@v4
        with:
          ref: arena/2abc0dfe-agent

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_HOME/platforms"
          ls "$ANDROID_HOME/build-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install web dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify web application
        run: |
          npm run test
          npm run lint

      - name: Build and synchronize Android assets
        run: npm run assets && npm run cap:sync

      - name: Assemble APK
        working-directory: android
        shell: bash
        run: |
          set +e
          ./gradlew assembleDebug --no-daemon > ../android-build.log 2>&1
          STATUS=$?
          cat ../android-build.log
          if [ "$STATUS" -ne 0 ]; then
            ESCAPED_LOG=$(tail -n 45 ../android-build.log | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error::${ESCAPED_LOG}"
          fi
          exit "$STATUS"

      - name: Verify target SDK and 16 KB APK alignment
        shell: bash
        run: |
          grep -q 'targetSdkVersion = 36' android/variables.gradle
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -n 1)
          "$ZIPALIGN" -c -P 16 -v 4 "$APK"
          NATIVE_COUNT=$(unzip -Z1 "$APK" | grep -c '\.so$' || true)
          echo "Native shared libraries: $NATIVE_COUNT"
          if [ "$NATIVE_COUNT" -eq 0 ]; then echo "Java/Kotlin-only package: no custom ELF alignment required."; fi

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk My-Vision-1.3.0-debug.apk

      - name: Create checksum
        run: sha256sum My-Vision-1.3.0-debug.apk > My-Vision-1.3.0-debug.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: My-Vision-1.3.0-debug
          path: |
            My-Vision-1.3.0-debug.apk
            My-Vision-1.3.0-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish downloadable APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: my-vision-v1.3.0-debug
          target_commitish: arena/2abc0dfe-agent
          name: My Vision v1.3.0 — Android APK
          body: |
            My Vision fotoğraf stüdyosunun kurulabilir Android test sürümü.

            - Paket: `com.myvision.studio`
            - Minimum sistem: Android 7.0 (API 24)
            - Derleme: debug imzalı, kurulabilir APK
            - Üretim: Play Store için imzalı AAB gerekir

            **1.3.0 yenilikleri:** Worker tabanlı gerçek piksel işleme, Curves/HSL/maskeler, cihaz içi rötuş ve arka plan kaldırma, kolaj/batch stüdyoları, özel tarifler, proje arşivi, TR/EN arayüz ve güvenli gerçek RevenueCat paket akışı.

            Android 7.0 ve üzeri cihazlara kurulabilir. Gerekirse kurulum sırasında bu kaynaktan uygulama yüklemeye izin verin. Bu genel test derlemesinde ödeme alınmaz; gerçek Google Play satın alımı için RevenueCat anahtarı ve ürünleri gerekir.

            Derleme raporu: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          prerelease: true
          draft: false
          overwrite_files: true
          files: |
            My-Vision-1.3.0-debug.apk
            My-Vision-1.3.0-debug.apk.sha256
