name: Build My Vision Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - arena/2abc0dfe-agent
    paths:
      - 'src/**'
      - 'public/**'
      - 'android/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.ts'
      - 'vite.config.ts'
      - 'tsconfig*.json'
      - 'index.html'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  assemble-debug:
    name: Assemble installable debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out My Vision
        uses: actions/checkout@v4
        with:
          ref: arena/2abc0dfe-agent

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 platform
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install web dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify web application
        run: |
          npm run test
          npm run lint

      - name: Build and synchronize Android assets
        run: npm run cap:sync

      - name: Assemble APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk My-Vision-1.0.0-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: My-Vision-1.0.0-debug
          path: My-Vision-1.0.0-debug.apk
          if-no-files-found: error
          retention-days: 30
