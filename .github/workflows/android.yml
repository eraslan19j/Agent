name: Android APK

# Builds a signed, installable APK from the web game bundle.
# Runs on every push to a session branch, and can be started manually.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: Build signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: game/package-lock.json

      - name: Install web dependencies
        working-directory: game
        run: npm ci --no-audit --no-fund

      - name: Type-check
        working-directory: game
        run: npx tsc --noEmit

      - name: Tests (logic + headless gameplay simulation)
        working-directory: game
        run: npm test

      - name: Build web bundle
        working-directory: game
        run: npx vite build

      - name: Verify bundle
        working-directory: game
        run: |
          test -f dist/index.html
          echo "bundle size: $(du -sh dist | cut -f1)"
          ls dist/assets | head -20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # The ubuntu-latest runner already ships a full Android SDK; we only make
      # sure the required platform/build-tools are present. Everything here is
      # non-fatal so a preinstalled SDK is always usable.
      - name: Prepare Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "SDK=$SDK" >> "$GITHUB_ENV"
          ls "$SDK/platforms" || true
          if [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
            "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" > /dev/null 2>&1 || true
          fi
          echo "--- after ---"
          ls "$SDK/platforms" || true
          ls "$SDK/build-tools" || true

      - name: Assemble release APK
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Verify APK signature
        working-directory: android
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          echo "APK: $APK"
          SIGNER=$(find "$SDK" -name apksigner -type f | sort -r | head -1)
          echo "apksigner: $SIGNER"
          "$SIGNER" verify --print-certs "$APK" || true
          ls -lh "$APK"

      - name: Rename artifact
        run: |
          mkdir -p out
          APK=$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)
          cp "$APK" out/Aetherion-0.2.0.apk
          ls -lh out

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aetherion-APK
          path: out/Aetherion-0.2.0.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish rolling release
        if: github.ref != 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete apk-web --yes --cleanup-tag 2>/dev/null || true
          gh release create apk-web out/Aetherion-0.2.0.apk \
            --title "AETHERION v0.2.0 — APK (${GITHUB_SHA:0:7})" \
            --notes "**AETHERION v0.2.0 “Ustalık”** — imzalı release APK · $(git rev-parse --short HEAD) · ${GITHUB_REF_NAME}

          **Kurulum:** APK'yı indir → telefonda “bilinmeyen kaynaklardan kuruluma izin ver” → kur → yatay tut.

          ### Bu sürümde
          - **Kaçınma (dash):** 0.24 s hız patlaması + dokunulmazlık kareleri, ekranda ⇢ butonu
          - **Havadan iniş saldırısı:** zıpladıktan sonra ⚔ → 4.4 m yarıçapında alan hasarı + sarsıntı
          - **Fizikli dünya:** ~70 varil/sandık/çömlek/taş bloğu; itilir, eğimden yuvarlanır, kırılıp ganimet düşürür
          - **Dinamik hava:** açık → yağmur → fırtına döngüsü, şimşek çakması, gök gürültüsü, ıslak sis
          - Yerinde zıplama düzeltildi (arazi çözümlemesi zıplamayı yutuyordu)
          - Beceri bekleme süreleri artık karakter başına

          ### Temel özellikler
          - 4 oynanabilir karakter (Anemo / Pyro / Electro / Cryo), 10 element tepkimesi
          - Koşma, zıplama, süzülme, tırmanma, yüzme, dayanıklılık
          - Prosedürel açık dünya (960×960 m), gündüz-gece, mühür taşları, sandıklar, görev zinciri
          - Otomatik kayıt, envanter, kodeks, harita" \
            --latest
