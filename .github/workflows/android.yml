name: Android APK

# Builds a signed, installable APK from the web game bundle.
# Runs on every push to a session branch, and can be started manually.

on:
  push:
    branches:
      - 'arena/**'
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: Build signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: game/package-lock.json

      - name: Install web dependencies
        working-directory: game
        run: npm ci --no-audit --no-fund

      - name: Type-check
        working-directory: game
        run: npx tsc --noEmit

      - name: Tests (logic + headless gameplay simulation)
        working-directory: game
        run: npm test

      - name: Build web bundle
        working-directory: game
        run: npx vite build

      - name: Verify bundle
        working-directory: game
        run: |
          test -f dist/index.html
          echo "bundle size: $(du -sh dist | cut -f1)"
          ls dist/assets | head -20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # The ubuntu-latest runner already ships a full Android SDK; we only make
      # sure the required platform/build-tools are present. Everything here is
      # non-fatal so a preinstalled SDK is always usable.
      - name: Prepare Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "SDK=$SDK" >> "$GITHUB_ENV"
          ls "$SDK/platforms" || true
          if [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
            "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" > /dev/null 2>&1 || true
          fi
          echo "--- after ---"
          ls "$SDK/platforms" || true
          ls "$SDK/build-tools" || true

      - name: Assemble release APK
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Verify APK signature
        working-directory: android
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          echo "APK: $APK"
          SIGNER=$(find "$SDK" -name apksigner -type f | sort -r | head -1)
          echo "apksigner: $SIGNER"
          "$SIGNER" verify --print-certs "$APK" || true
          ls -lh "$APK"

      - name: Rename artifact
        run: |
          mkdir -p out
          APK=$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)
          cp "$APK" out/Aetherion-0.1.0.apk
          ls -lh out

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aetherion-APK
          path: out/Aetherion-0.1.0.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish rolling release
        if: github.ref != 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete apk-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create apk-latest out/Aetherion-0.1.0.apk \
            --title "AETHERION — APK (${GITHUB_SHA:0:7})" \
            --notes "AETHERION v0.1.0 “İlk Işık” — signed release APK, built from $(git rev-parse --short HEAD) on branch ${GITHUB_REF_NAME}.

          Kurulum: APK'yı indir, telefonda 'bilinmeyen kaynaklardan kurulum'a izin ver, yatay modda aç.

          - 4 oynanabilir karakter (Anemo / Pyro / Electro / Cryo)
          - Element tepkimeleri: Buharlaşma, Erime, Aşırı Yük, Donma, Girdap, Kristalleşme
          - Sürüklenme, tırmanma, yüzme, dayanıklılık
          - Prosedürel açık dünya, gündüz-gece, mühür taşları, sandıklar, görev zinciri" \
            --latest
